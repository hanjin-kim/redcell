name: "Korean Payments 2026: Toss vs Kakao Pay vs Naver Pay"
closed_market: true
intensity_jitter: 0.15
domain: competitive
industry: fintech_korea_payments
time_unit: year
time_horizon: 5

# Position-tier → per-turn revenue (transaction fee + financial product) mapping.
# Korean payments market: high MAU, low margin per txn, monetization via
# adjacent products (loan, insurance, securities, advertising):
#   dominant: MAU 4000만+, super-app monetization, banking ecosystem
#   strong: MAU 3000만, adjacent product traction
#   contested: MAU 2000만, monetization gap
#   weak: MAU 1000만 미만, viability 의문
#   marginal: niche only
position_revenue:
  dominant: 0.08
  strong: 0.05
  contested: 0.03
  weak: 0.01
  marginal: -0.01
trigger_event: "한국 금감원이 2026 Q1 간편결제 수수료 자율 인하 가이드라인 발표 — 가맹점 결제 수수료 1.5-2.0% → 1.0-1.3% 권고. 동시에 Toss가 2026 H2 미국 나스닥 IPO 추진 (목표 시가총액 200억 달러), 자금 조달로 글로벌 진출 + AI 기반 신용평가 가속화. Kakao 그룹은 sm엔터 인수 이후 카카오페이 자체 수익화 압박 강해짐 — 단기 가맹점 fee 부담 감수 어려움. Naver는 커머스(네이버 쇼핑) + 페이 통합으로 가맹점 lock-in 강화 모드."

_additional_context: |
  CANONICAL PROPER NOUNS:
    Toss(토스/비바리퍼블리카), Kakao Pay(카카오페이), Naver Pay(네이버페이),
    Kakao Bank(카카오뱅크), Toss Securities(토스증권), Toss Bank(토스뱅크),
    금감원(FSS), 한국은행(BOK), 간편결제, 후불결제(BNPL)

  Market context (Q1 2026 ground truth):
  - 한국 간편결제 일평균 거래액 1조 5천억원 (연 600조), MAU 4500만.
  - Toss MAU 2300만, 결제 + 송금 + 증권 + 뱅킹 통합 super-app. 가맹점 거래액
    점유 30%.
  - Kakao Pay MAU 4000만 (메신저 ecosystem), 결제 점유 40%. 단 monetization은
    Toss 대비 후행.
  - Naver Pay MAU 3500만 (네이버 쇼핑 ecosystem), 점유 25%. 가맹점 lock-in 강함.
  - 한국 간편결제 가맹점 수수료가 미국 PayPal 대비 1/2 수준 — 금감원 인하 권고로
    여기서 더 압축 압박.

  Monetization model:
  - 결제 수수료: 거래액의 1.0-2.0%, 가맹점 부담. (정부 인하 압박 강함)
  - 후불결제(BNPL): Toss/네이버 모두 출시, 한도 30만원, 자체 신용평가.
  - 증권/투자: Toss 증권 MAU 1100만, Kakao 페이증권 800만 — 거래 수수료 + 운용 수익.
  - 보험: Toss 보험 + 카카오 페이 보험 — 디지털 비교/가입 수수료.
  - 광고: Naver Pay 쇼핑광고 + Toss 카드 추천 — 광고 ARPU 증가 중.

  Strategic dilemmas:
  - Toss: IPO로 자금 조달 → 글로벌 진출 (베트남/일본) vs 한국 super-app 수익화 강화.
    상장 후 단기 수익 압박과 장기 성장 투자의 균형.
  - Kakao Pay: 메신저 ecosystem leverage vs 자체 수익 증명. 카카오 그룹 정치 이슈
    (sm엔터 등) 영향 받음, 모회사 압박.
  - Naver Pay: 네이버 쇼핑과의 deep integration 강점 vs OTT 자체 super-app 부재.

  Key scenario pressures:
  - 정부 수수료 인하 권고는 3사 모두 결제 수익 감소, BNPL/광고 monetization으로 보전 필요.
  - Toss IPO 자금이 베트남/일본 진출에 투입 시 한국 경쟁 강도 일시 완화 가능.
  - Kakao 그룹 거버넌스 위기가 Kakao Pay 자율성 압박 → 단기 의사결정 보수화 우려.
  - Naver 쇼핑 거래액 성장률 둔화 시 Naver Pay 가맹점 lock-in 효과 약화.

simulation_constraints:
  - "간편결제 수수료 인하는 정부 가이드라인 발효 후 1-2 분기 내 시장 반영"
  - "BNPL 한도 인상은 금감원 승인 필요 — 6-12개월 lag"
  - "글로벌 진출 (베트남/일본)은 현지 라이센스 + 가맹점 영업 — 2-3년 ramp"
  - "광고 매출 활성화는 광고주 영업 + ad tech 인프라 lag 6-12개월"

