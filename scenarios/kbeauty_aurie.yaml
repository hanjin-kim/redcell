name: "AURIE 2026: K-Beauty Premium-Asia Dual Track vs Shiseido/Amore"
closed_market: true
intensity_jitter: 0.15
domain: competitive
industry: kbeauty_premium_skincare
time_unit: year
time_horizon: 5

# Position-tier → per-turn revenue (cash) mapping. Industry-specific calibration.
# Engine computes ending cash = starting − action_cost + events_delta + position_revenue[tier].
# K-beauty premium skincare typical margin spread:
#   dominant brand: high margin + high volume from anchor SKUs + brand premium
#   strong: solid but contested
#   contested: middle, fighting for share
#   weak: margin pressure
#   marginal: near-loss
# These values are the *modeling assumption* — user should adjust per industry
# context and revisit if outcome trajectory looks unreasonable.
position_revenue:
  dominant: 0.12
  strong: 0.08
  contested: 0.05
  weak: 0.03
  marginal: 0.01
trigger_event: "K-beauty 글로벌 인기가 정체기에 진입(2024-2025 한국 화장품 수출 둔화), 일본 J-beauty 부상 + 중국 자국 브랜드(Proya, Florasis) 강세로 한국 mid-cap 브랜드의 동남아·일본 진출이 다음 24개월 생존축. 동시에 시세이도가 K-beauty 가격대(mass-premium)로 다운 포지셔닝, 중국 정부의 한국 화장품 수입 inspection 강화 risk가 운전자본 부담으로 작용 중."

_additional_context: |
  CANONICAL PROPER NOUNS:
    AURIE(아우리, 가상 한국 mid-cap), Shiseido(시세이도), Amore Pacific(아모레퍼시픽),
    LG H&H, Proya(중국), Sephora, Olive Young, Don Quijote(돈키호테), Watsons

  Market context (Q1 2026 ground truth):
  - 한국 화장품 수출 YoY +2% (2024-2025 정체기). K-beauty 글로벌 모멘텀 둔화.
  - 일본 J-beauty 수출 YoY +18% (시세이도 주도). 일본 내수 회복 + 아시아 prestige 채널 점유 회복.
  - 중국 자국 브랜드(Proya, Florasis 등) 자국 시장 점유율 60%+ 도달. 한국 브랜드 중국 매출 2년 연속 감소.
  - 동남아(인니/베트남/태국) prestige skincare 시장 YoY +25%, K-beauty mid-premium 진출 기회.
  - 한국 mid-cap 브랜드 (매출 5000억-1.5조 구간): 글로벌 5-15위, 한국 5-10위.

  채널 dynamics:
  - 한국 면세 채널 회복 정체. 중국 보따리상(다이고우) 의존도 축소 압박.
  - 일본 시장 진입: Don Quijote (mass), 한큐/이세탄 백화점 (prestige), Cosme.com (online).
    Shiseido 본진이라 마진/유통권 challenge 큼.
  - 동남아: Watsons / Sephora SEA / TikTok Shop 인플루언서. 마진 매력 있으나 brand-building 비용 부담.
  - D2C 자체몰: brand equity 축적은 가능하나 CAC 압박, ROAS 1.5-2 수준.

  Strategic dilemmas (각 플레이어):
  - AURIE: 프리미엄 SKU 집중 vs mass-market 다운 포지셔닝 압박. 일본 직영 확장 capex
    vs 단기 마진 압박. 중국 의존도 축소가 단기 매출 손실을 감내할 수 있는가?
  - Shiseido: J-beauty 부활 + K-beauty 가격대 침투로 한국 mid-cap 시장 공격.
    한국에서 mass-premium SKU 30% 가격 인하 발표(2025 Q4) — AURIE 같은 한국 5-10위 압박.
  - Amore Pacific: 한국 1위 방어 + 미국·동남아 확장. AURIE의 일본 침투에는 무관심하나
    동남아·D2C에서 경쟁. 자체 R&D + Sephora 글로벌 채널 강세.

  Key scenario pressures:
  - Shiseido의 한국 mass-premium 가격 인하가 AURIE 프리미엄 전략의 customer base를 잠식.
  - 중국 통관 검역 강화 시 AURIE 재고/운전자본 부담 폭증. 중국 의존 축소 *명분*은 강해지나
    *전환기 cash burn*이 capex 여력을 압박.
  - 일본 직영 50개 신설은 18-24개월 소요, 단기 EBIT 마진 압박.
  - Amore가 동남아·D2C에 본격 진입 시 AURIE의 동남아 경로 마진 침식.

simulation_constraints:
  - "각 플레이어가 한 해에 둘 이상의 큰 capex 전환을 동시에 집행할 수 없음 (조직 absorption capacity 제약)"
  - "일본 직영 매장 capex는 첫 해 비용 발생, EBIT contribution은 2년차부터 본격화 (브랜드 빌딩 lag)"
  - "한국 채널 mass-premium 가격 인하의 마진 압박은 동일 해 즉시 반영, share 재편은 1-2년 지속"
  - "R&D 비중 증가(7→12%)는 1-2년 비용 선행, clinical data 누적·신규 SKU 효과는 3년차부터"
  - "중국 의존도 축소는 단기 매출 감소 → 일본/동남아 확대로 메우는 데 2-3년 transition window"

