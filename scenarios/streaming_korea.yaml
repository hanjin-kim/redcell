name: "Korea Streaming 2026: Coupang Play vs Netflix vs Tving"
closed_market: true
intensity_jitter: 0.15
domain: competitive
industry: streaming_korea_ott
time_unit: year
time_horizon: 5

# Position-tier → per-turn revenue (subscriber-driven net cash) mapping.
# Streaming is a subscriber + ad revenue business with heavy content amortization:
#   dominant: 800만+ paid subscribers, ad tier scale, content moat
#   strong: 400만+ paid + healthy ARPU
#   contested: 200만 수준, ARPU 압박
#   weak: subscriber churn, content ROI 의문
#   marginal: 100만 미만, viability 의문
position_revenue:
  dominant: 0.10
  strong: 0.07
  contested: 0.04
  weak: 0.01
  marginal: -0.02
trigger_event: "Netflix가 2026 Q1부터 한국 베이직(광고 포함) 5,500원 → 7,900원, 스탠더드 13,500원 → 17,000원 가격 인상 발표. 동시에 한국 오리지널 콘텐츠 투자 연 7000억원 → 1조원 확대 발표. Coupang Play는 로켓와우 멤버십 끼워팔기로 사실상 무료 사용자 850만 확보 — 광고 inventory + 스포츠(MLB) 독점으로 ARPU 보전 시도. Tving은 한국 지상파(JTBC/CJ) 콘텐츠 풀 + KBO 야구 독점으로 시즌 ARPU 변동 큼."

_additional_context: |
  CANONICAL PROPER NOUNS:
    Coupang Play(쿠팡플레이), Netflix Korea, Tving(티빙), Wavve, Disney+ Korea,
    JTBC, CJ ENM, KBO(한국야구위원회), MLB Korea, 로켓와우(Rocket WOW)

  Market context (Q1 2026 ground truth):
  - 한국 OTT 가입자(중복 포함) 2,500만, MAU 기준 Netflix 1100만 / Coupang Play 850만 /
    Tving 500만 / Wavve 350만 / Disney+ 250만.
  - 광고 지원 베이직 tier가 신규 가입의 60%+, ARPU는 standard의 40% 수준.
  - 한국 오리지널 콘텐츠 글로벌 hit (오징어게임 시즌 3 2026 출시 예정)이 글로벌 가입자
    유인의 핵심 자산. Netflix가 2017년 이래 한국 콘텐츠에만 누적 $3.5B 투자.
  - 스포츠 라이브 콘텐츠가 churn 방어의 핵심 — MLB(쿠팡), KBO(티빙), EPL(쿠팡 협상 중),
    UFC(쿠팡 일부) — 시즌별 사용자 spike 발생.

  Business model dynamics:
  - 콘텐츠 amortization: 오리지널 한 작품당 200-500억원, 회수까지 3-5년.
  - 광고 inventory: 한국 디지털 광고 시장 약 9조원, OTT 광고 비중 10% (확장 중).
  - 멤버십 끼워팔기: Coupang Play(로켓와우), Naver Plus(Tving 일부), KT 통신 멤버십.
  - 결제: 신용카드 + 통신사 합산 청구가 churn에 유리.

  Strategic dilemmas:
  - Coupang Play: e-commerce 끼워팔기 모델 vs 콘텐츠 단독 ARPU 모델 전환. 이커머스 LTV
    제고 vs 콘텐츠 자체 수익화.
  - Netflix Korea: 가격 인상 + 콘텐츠 확대로 ARPU 방어 vs 가격 민감 사용자 churn 위험.
  - Tving: 한국 콘텐츠 풀 우위 vs 글로벌 콘텐츠 부재. 광고 tier 활성화 vs ARPU 보전.

  Key scenario pressures:
  - Netflix 가격 인상이 Coupang Play 무료 사용자에게 churn driver 작용.
  - KBO 시즌 (3-10월) 동안 Tving subscribers 폭증, off-season 감소.
  - 오징어게임 시즌 3 출시 시점 Netflix global subscribers spike → 한국 사용자 stickness 강화.
  - Coupang의 로켓와우 가격 인상 (4,990 → 7,890원) 시 OTT 끼워팔기 ROI 변화.

simulation_constraints:
  - "오리지널 콘텐츠 1편 제작은 18-24개월 소요, 효과는 출시 후 3-6개월에 집중"
  - "광고 tier 활성화는 6-12개월 광고주 영업 + ad server 인프라 lag"
  - "스포츠 라이센스는 multi-year 계약 — 한 시즌에 한 번 갱신 협상 가능"
  - "subscriber acquisition cost (SAC) 회수까지 12-18개월"
  - "콘텐츠 amortization 기간이 EBIT에 직접 영향 — 5년 평준화 가정"

