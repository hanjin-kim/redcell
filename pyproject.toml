[project]
name = "redcell"
version = "0.1.0"
description = "Adversarial strategy scenario generator — turn a strategy + a worry into N distinct stress-test scenarios with cash/position trajectories and workshop diligence questions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
    "typer>=0.12",
    "pydantic>=2.0",
]

[project.scripts]
redcell = "redcell.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redcell"]

# NOTE: during the 0.1 bootstrap the simulation engine (multi-agent C-suite
# deliberation + adjudication panel + event deck) is imported from the
# parent `strategyforge` package via redcell/engine.py. Vendoring those
# modules into redcell/ (cutting the strategyforge dependency entirely) is
# tracked as the next milestone — engine.py is the single extraction
# boundary that needs to change.
