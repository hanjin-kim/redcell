competitor_strategies:
  side_b: 금감원 수수료 가이드라인으로 인한 마진 압박을 극복하기 위해, 김범수 전 대표의 사법 리스크로 인해 보수화된 의사결정 구조 하에서
    메신저 MAU 기반의 '소액·高频' 결제 트래픽을 극대화하여 가맹점 이탈을 방지하고, 그룹 내 콘텐츠 및 금융 상품 연동을 통한 ARPU 점진적
    개선에 집중할 것.
  side_c: 쇼핑 거래액 잠금 (lock-in) 전략을 가속화하여 결제 자체의 직접 마진 손실을 쇼핑 생태계 내 재구매율 및 로열티 강화로 상쇄하되,
    단독 슈퍼앱 확장은 자제하고 네이버 쇼핑과의 시너지를 최우선으로 하여 가맹점 수수료 인하 압력을 '고객 경험 최적화'라는 명분으로 전환할 것.
